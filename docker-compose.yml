services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rust-app
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
    volumes:
      - .:/usr/src/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/usr/src/app/target
    restart: unless-stopped

volumes:
  cargo-cache:
  target-cache: